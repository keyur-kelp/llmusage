# LiteLLM proxy config. Models listed here come back on every start; models can also be added
# in the LiteLLM UI (STORE_MODEL_IN_DB=True). The app's picker default is DEFAULT_MODEL, not list order.
# The Anthropic key is a stored credential named `anthropic` (created in the LiteLLM UI), never in this file.
model_list:
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      litellm_credential_name: anthropic
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      litellm_credential_name: anthropic
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      litellm_credential_name: anthropic

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  include_cost_in_streaming_usage: true
  drop_params: true
